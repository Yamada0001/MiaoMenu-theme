menu_title: "&b&l夏日海滩 &7| &f四季主题"
rows: 3

# 四季主题模板：图片来自主题资源包（themes/ 目录）。
# 未安装资源包时 image: 会退化为普通纸张，菜单依然可用。
view_requirement:
  deny_message: "&c你当前还不能打开这个菜单。"
  requirements:
    - type: permission
      permission: dgeysermenu.use

items:
  theme_art:
    slot: 4
    material: "image:summer_beach"
    display_name: "&b&l夏日海滩"
    lore:
      - "&7阳光海滩主题，含椰子树、遮阳伞与海浪"
      - "&8image:summer_beach"

  open_dialog:
    slot: 11
    material: TROPICAL_FISH
    display_name: "&b&l以对话框打开"
    lore:
      - "&7打开同名的原生 Dialog 菜单"
    left_click_commands:
      - "[menu] dialog:theme-summer"

  player_info:
    slot: 13
    material: PLAYER_HEAD
    display_name: "&f&l当前玩家"
    lore:
      - "&f昵称: &e%player_name%"
      - "&f世界: &b%player_world%"

  close:
    slot: 15
    material: BARRIER
    display_name: "&c&l关闭菜单"
    lore:
      - "&7点击关闭"
    left_click_commands:
      - "[close]"

  theme_art_footer:
    slot: 22
    material: "image:summer_beach"
    display_name: "&7四季主题 · 夏"
