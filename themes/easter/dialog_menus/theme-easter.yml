title: "&b&l复活节"
external_title: "&bMiaoMenu · 复活节"
can_close_with_escape: true
pause: false
after_action: close

layout:
  type: multi_action
  columns: 2
  exit_button:
    label: "&c关闭"
    tooltip: "&7回到游戏"
    width: 100

body:
  - type: text
    text: "&f欢迎，&e%player_name%&f。"
    width: 320
  - type: item
    material: "image:easter"
    display_name: "&b&l复活节"
    description: "&7节日主题 · 复活节"
    show_decorations: true
    show_tooltip: true
    width: 32
    height: 32

buttons:
  - label: "&a送上祝福"
    item: RABBIT_SPAWN_EGG
    tooltip: "&7发送一句节日问候"
    width: 150
    actions:
      - "[message] &b复活节快乐，春天来了。"

  - label: "&b打开背包菜单"
    item: BUNDLE
    tooltip: "&7打开同名 Java 菜单"
    width: 150
    actions:
      - "[menu] java:theme-easter"

dynamic_lists:
  - source: online_players
    label: "&b玩家: &f$(display)"
    tooltip: "&7向 $(value) 问好"
    width: 150
    limit: 10
    sort: true
    empty_label: "&7当前没有其他在线玩家"
    actions:
      - "[player] msg $(value) &b复活节快乐，春天来了。"

view_requirement:
  deny_message: "&c你当前还不能打开这个菜单。"
  requirements:
    - type: permission
      permission: dgeysermenu.use
