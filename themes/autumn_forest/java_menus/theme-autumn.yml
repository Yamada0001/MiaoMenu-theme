menu_title: "&6&l秋日森林 &7| &f四季主题"
rows: 3

# 四季主题模板：图片来自主题资源包（themes/ 目录）。
# 未安装资源包时 image: 会退化为普通纸张，菜单依然可用。
view_requirement:
  deny_message: "&c你当前还不能打开这个菜单。"
  requirements:
    - type: permission
      permission: dgeysermenu.use

items:
  theme_art:
    slot: 4
    material: "image:autumn_forest"
    display_name: "&6&l秋日森林"
    lore:
      - "&7秋日森林主题，含落叶树与蘑菇"
      - "&8image:autumn_forest"

  open_dialog:
    slot: 11
    material: OAK_SAPLING
    display_name: "&6&l以对话框打开"
    lore:
      - "&7打开同名的原生 Dialog 菜单"
    left_click_commands:
      - "[menu] dialog:theme-autumn"

  player_info:
    slot: 13
    material: PLAYER_HEAD
    display_name: "&f&l当前玩家"
    lore:
      - "&f昵称: &e%player_name%"
      - "&f世界: &b%player_world%"

  close:
    slot: 15
    material: BARRIER
    display_name: "&c&l关闭菜单"
    lore:
      - "&7点击关闭"
    left_click_commands:
      - "[close]"

  theme_art_footer:
    slot: 22
    material: "image:autumn_forest"
    display_name: "&7四季主题 · 秋"
