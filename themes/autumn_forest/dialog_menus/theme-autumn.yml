title: "&6&l秋日森林"
external_title: "&6MiaoMenu · 秋"
can_close_with_escape: true
pause: false
after_action: close

layout:
  type: multi_action
  columns: 2
  exit_button:
    label: "&c关闭"
    tooltip: "&7回到游戏"
    width: 100

body:
  - type: text
    text: "&f欢迎，&e%player_name%&f。"
    width: 320
  - type: item
    material: "image:autumn_forest"
    display_name: "&6&l秋日森林"
    description: "&7四季主题 · 秋"
    show_decorations: true
    show_tooltip: true
    width: 32
    height: 32

buttons:
  - label: "&a打个招呼"
    item: OAK_SAPLING
    tooltip: "&7发送一句与主题相关的问候"
    width: 150
    actions:
      - "[message] &6落叶铺满了森林小径。"

  - label: "&b打开背包菜单"
    item: BUNDLE
    tooltip: "&7打开同名 Java 菜单"
    width: 150
    actions:
      - "[menu] java:theme-autumn"

dynamic_lists:
  - source: online_players
    label: "&6玩家: &f$(display)"
    tooltip: "&7向 $(value) 问好"
    width: 150
    limit: 10
    sort: true
    empty_label: "&7当前没有其他在线玩家"
    actions:
      - "[player] msg $(value) 秋日快乐！"

view_requirement:
  deny_message: "&c你当前还不能打开这个菜单。"
  requirements:
    - type: permission
      permission: dgeysermenu.use
